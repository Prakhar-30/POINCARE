[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}, {access = "read-write", path = "./analysis/simulation/"}, {access = "read-write", path = "./deployments/"}]
libs = ["lib"]
out = "out"
solc_version = "0.8.30"
src = "src"
via_ir = false
# The Sepolia-fork simulation lives in test/sim and needs the IR pipeline (the large simulation
# contract is stack-too-deep without it) + a fork RPC. Keep it OUT of the default build/test so
# `forge test` stays fast and via-ir-free; run it under the `sim` profile (below).
skip = ["test/sim/**"]

# Isolated profile for the heavy fork simulation: enables IR and re-includes test/sim.
# Inherits everything else from [profile.default]. Run: FOUNDRY_PROFILE=sim forge test --match-path test/sim/...
[profile.sim]
via_ir = true
# via-IR without the optimizer is where "stack too deep" comes back as an IR-level error, and
# this profile un-skips the whole tree so it compiles the heavier back-test contracts too.
# The optimizer is what makes IR stack allocation tractable; `[profile.deploy]` already pairs
# the two for the same reason.
optimizer = true
optimizer_runs = 200
skip = []

# Profile for the ROUTER/LENS integration check, which is the one fork test an integrator might
# reasonably want to run themselves.
#
# It does not belong behind the `sim` profile's build. That profile needs via-IR for the two big
# replay contracts, and via-IR plus the optimizer over the whole tree is a twenty-minute compile
# — a price worth paying once for a four-year study and absurd for a proof that quotes match
# execution. Skipping those two contracts keeps this on the normal pipeline, where it compiles in
# seconds.
#
# Run: FOUNDRY_PROFILE=fork forge test --match-path test/sim/ForkRouterLens.t.sol
[profile.fork]
skip = ["test/sim/ForkRealData.t.sol", "test/sim/ForkSimulation.t.sol"]
# The 12-month replay (2190 points, two pools) outgrows the default 2^30 gas /
# 128MB memory caps inside a single test; lift both for this profile only.
gas_limit = "18446744073709551615"
memory_limit = 1073741824

# Profile for live deployment. The PoincareHook is 28KB unoptimized (over the 24.5KB EIP-170
# limit — tests never hit this because deployCodeTo bypasses it). Optimizer + IR shrinks it to
# ~13KB. Run: FOUNDRY_PROFILE=deploy forge script script/DeployPoincareUnichain.s.sol ...
[profile.deploy]
via_ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"
unichain_sepolia = "https://sepolia.unichain.org"

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

# Profile for the four-year parameter sweeps in test/optimal. Each replay is 7,776 bars and a
# sweep runs several per test, which outgrows the default 2^30 gas / 128MB memory caps. Lift
# both here only, so `forge test` stays honest about gas everywhere else.
# Run: FOUNDRY_PROFILE=sweep forge test --match-path test/optimal/GammaFourYear.t.sol
[profile.sweep]
gas_limit = "18446744073709551615"
memory_limit = 4294967296
