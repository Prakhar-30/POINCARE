name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Foundry Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # The default profile skips test/sim (the fork replays need an archive RPC), so this is
      # the whole offline suite: unit, fuzz, invariant, manipulation, calibration, regression.
      - name: Build
        run: |
          forge --version
          forge build
        id: build

      - name: Test
        run: forge test -vv
        id: test

      # The hook is over EIP-170 unoptimized (tests bypass the limit via deployCodeTo), so the
      # size that matters is the one we actually deploy: optimizer + IR, the `deploy` profile.
      - name: Contract sizes (deploy profile)
        run: FOUNDRY_PROFILE=deploy forge build --sizes

  frontend:
    name: Detector Lab (off-chain port)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Lab replays the pool's real history through a TypeScript port of Cusum.sol,
      # DirectionalSignal.sol and ControlLaw.sol. These tests hold that port against the
      # Solidity's own vectors AND against a committed capture of the live Unichain Sepolia
      # trace, which it must reproduce to the wei. A drift between the contracts and the
      # port fails here rather than quietly mis-drawing a chart.
      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
